# К PostgreSQL можно подключиться только из подов приложения.
# Работает, если сетевой плагин кластера поддерживает NetworkPolicy (Calico, Cilium и др.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-only
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
