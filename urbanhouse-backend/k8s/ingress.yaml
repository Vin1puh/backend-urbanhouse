# Доступ снаружи по адресу http://urbanhouse.local (нужен ingress-nginx и запись в hosts)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  labels:
    app: backend
spec:
  ingressClassName: nginx
  rules:
    - host: urbanhouse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
